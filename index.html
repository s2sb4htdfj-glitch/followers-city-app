
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مدينة المتابعين</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#9bd3e2}
#city{position:fixed;inset:0}
#top{position:fixed;top:10px;right:10px;left:10px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#ffffffed;border-radius:15px;padding:10px 13px;box-shadow:0 3px 14px #0002;pointer-events:auto}
#counter{font-weight:bold;color:#244b3b}
#tools{display:flex;gap:6px;align-items:center}
button{border:0;border-radius:10px;padding:10px 13px;background:#286b50;color:white;font-weight:bold;font-size:14px}
button.secondary{background:#e8eee9;color:#244b3b}
button.danger{background:#c94141;color:white}
#add{position:fixed;bottom:18px;right:15px;z-index:6;padding:15px 20px;border-radius:15px;font-size:16px}
#searchBox{position:fixed;top:67px;right:10px;z-index:5;width:190px}
#search{width:100%;border:0;border-radius:12px;padding:11px;outline:none}
#modal,#loginModal{display:none;position:fixed;inset:0;background:#0009;z-index:20;align-items:center;justify-content:center;padding:15px}
#panel,#loginPanel{width:min(420px,100%);background:white;border-radius:20px;padding:20px;max-height:90vh;overflow:auto}
#panel h2,#loginPanel h2{text-align:center;margin:0 0 17px;color:#244b3b}
#panel input,#loginPanel input{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px;font-size:15px;direction:auto}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 17px}
.level{border:2px solid #e4e4e4;border-radius:12px;padding:12px 5px;text-align:center;background:#fafafa;color:#333;cursor:pointer}
.level.selected{border-color:#25875d;background:#e8f6ee}
.level .emoji{font-size:27px;display:block;margin-bottom:5px}
.level:last-child{grid-column:1/-1}
.actions{display:flex;gap:9px}
.actions button{flex:1;padding:13px}
#info{display:none;position:fixed;bottom:15px;left:12px;right:12px;z-index:10;background:#fff;border-radius:17px;padding:14px;box-shadow:0 4px 18px #0003}
#infoTop{display:flex;justify-content:space-between;align-items:center;gap:10px}
#infoName{font-size:17px;font-weight:bold;color:#244b3b}
#infoLevel{font-size:13px;color:#777;margin-top:5px;overflow-wrap:anywhere}
#infoActions{display:flex;gap:7px;margin-top:12px}
#infoActions button{flex:1}
#hint{position:fixed;bottom:85px;right:12px;color:#244b3b;background:#ffffffd9;padding:8px 11px;border-radius:10px;font-size:12px}
#loginMessage{font-size:13px;color:#a33;margin:5px 0 12px;min-height:18px}
#adminStatus{font-size:12px;color:#286b50}
@media(max-width:500px){
 #tools button{padding:8px;font-size:11px}
 #top{gap:5px}
 #searchBox{top:66px;width:155px}
 #hint{bottom:82px}
}
</style>
</head>
<body>
<div id="city"></div>

<div id="top">
 <div class="panel">
  <div id="counter">🏘️ المتابعون: 0</div>
  <div id="adminStatus"></div>
 </div>
 <div id="tools">
  <button class="secondary" onclick="zoomIn()">＋</button>
  <button class="secondary" onclick="zoomOut()">－</button>
  <button class="secondary" onclick="resetView()">⌂</button>
  <button class="secondary" id="dayNightBtn" onclick="toggleDayNight()">🌙 ليل</button>
  <button class="secondary" id="loginBtn" style="display:none" onclick="openLogin()">🔐 دخول</button>
  <button class="secondary" id="logoutBtn" style="display:none" onclick="logoutAdmin()">خروج</button>
 </div>
</div>

<div id="searchBox">
 <input id="search" placeholder="🔍 ابحث عن متابع..." oninput="searchHouse()">
</div>

<div id="hint">اسحب لتحريك المدينة • بإصبعين للتكبير</div>
<button id="add" onclick="openAdd()">＋ إضافة بيت</button>

<div id="info">
 <div id="infoTop">
  <div>
   <div id="infoName"></div>
   <div id="infoLevel"></div>
  </div>
  <button class="secondary" onclick="closeInfo()">✕</button>
 </div>
 <div id="infoActions">
  <button onclick="editSelected()">✏️ تعديل</button>
  <button class="danger" onclick="deleteSelected()">🗑️ حذف</button>
 </div>
</div>

<div id="modal">
 <div id="panel">
  <h2 id="modalTitle">🏡 إضافة بيت جديد</h2>
  <input id="followerName" placeholder="اسم المتابع">
  <input id="followerAccount" placeholder="حساب المتابع أو رابطه">
  <div class="levels">
   <div class="level selected" data-level="1" onclick="chooseLevel(1)"><span class="emoji">🏠</span>المستوى 1<br>بيت عربي بسيط</div>
   <div class="level" data-level="2" onclick="chooseLevel(2)"><span class="emoji">🏡</span>المستوى 2<br>بيت عربي بشرفة</div>
   <div class="level" data-level="3" onclick="chooseLevel(3)"><span class="emoji">🏘️</span>المستوى 3<br>بيت عربي بطابقين</div>
   <div class="level" data-level="4" onclick="chooseLevel(4)"><span class="emoji">🏛️</span>المستوى 4<br>فيلا عربية فخمة</div>
   <div class="level" data-level="5" onclick="chooseLevel(5)"><span class="emoji">👑</span>المستوى 5<br>قصر عربي ملكي</div>
  </div>
  <div class="actions">
   <button id="saveHouseBtn" onclick="saveHouse()">حفظ البيت</button>
   <button class="secondary" onclick="closeModal()">إلغاء</button>
  </div>
 </div>
</div>

<div id="loginModal">
 <div id="loginPanel">
  <h2>🔐 دخول مدير المدينة</h2>
  <input id="adminEmail" type="email" placeholder="البريد الإلكتروني">
  <input id="adminPassword" type="password" placeholder="كلمة المرور">
  <div id="loginMessage"></div>
  <div class="actions">
   <button onclick="loginAdmin()">دخول</button>
   <button class="secondary" onclick="closeLogin()">إلغاء</button>
  </div>
 </div>
</div>

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const groundMat=mat(0xd9c69c),roadMat=mat(0x777b7a),lineMat=mat(0xf4e6bd);
const greenMat=mat(0x39824d),darkGreen=mat(0x235c3c),stoneMat=mat(0xd8cbb2);

function box(parent,x,y,z,w,h,d,material){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
 parent.add(m);return m;
}
function cylinder(parent,x,y,z,r1,r2,h,material,segments=16){
 const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
 m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}
function roof(parent,x,y,z,w,h,d,material,rotation=0){
 const m=new THREE.Mesh(new THREE.ConeGeometry(w*.77,h,4),material);
 m.rotation.y=Math.PI/4+rotation;m.scale.z=d/w;
 m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}

 }
}
for(let p=-500;p<=500;p+=100){

}

function makeLabel(text,width=19){
 const canvas=document.createElement("canvas");
 canvas.width=512;canvas.height=128;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="rgba(255,255,255,.94)";
 ctx.beginPath();ctx.roundRect(8,8,496,112,25);ctx.fill();
 ctx.fillStyle="#244b3b";ctx.font="bold 43px Arial";
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(text,256,64);
 const texture=new THREE.CanvasTexture(canvas);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true}));
 sprite.scale.set(width,width*.25,1);sprite.position.y=12;
 return sprite;
}
function addLandmarkLabel(text,x,y,z){

}

function makeHouse(data,index){
 const g=new THREE.Group();
 const level=Math.min(5,Math.max(1,Number(data.level)||1));
 const c=houseColors[level-1];
 const wall=mat(c.wall),roofMat=mat(c.roof),trim=mat(c.trim);

 const wood=mat(0x68432f);
 const gold=mat(0xd5ae63);
 const dark=mat(0x76503b);

 // قاعدة البيت والجدران الأساسية
 box(g,0,.25,0,11,.5,9,trim);
 box(g,0,3.2,0,10,6,8,wall);
 box(g,0,6.25,0,10.5,.35,8.5,trim);

 // زخرفة الواجهة العربية

 // باب رئيسي
 box(g,0,2,4.12,1.8,4,.22,wood);

 cylinder(g,.55,2,4.3,.09,.09,.12,gold,10);

 // نوافذ أمامية بإطارات
 for(const x of [-3.2,3.2]){

 }

 // أقواس زخرفية فوق النوافذ
 function arch(x,y,z,r,color){
  const a=new THREE.Mesh(
   new THREE.TorusGeometry(r,.12,8,24,Math.PI),
   mat(color)
  );
  a.position.set(x,y,z);

 }
 arch(-3.2,5.05,4.18,1,0xc49a62);
 arch(3.2,5.05,4.18,1,0xc49a62);

 // درجات المدخل
 box(g,0,.35,5,3,.3,1.2,stoneMat);
 box(g,0,.65,4.65,2.5,.3,.7,trim);

 function columns(){

  columns();

  box(g,0,7,0,10.7,.6,8.7,roofMat);
  box(g,0,7.45,0,8,.25,6.5,trim);
  for(let x=-3.5;x<=3.5;x+=1.4){
   box(g,x,7.8,-3,.12,.7,.12,gold);
  }
  roof(g,0,9,0,6,2,6,roofMat);
 }

 // المستوى الثالث: طابقان وأقواس وشرفة علوية
 if(level===3){
  columns();
  box(g,0,8.5,0,9,4.2,7,wall);
  box(g,0,10.65,0,9.5,.25,7.5,trim);

  for(const x of [-2.8,2.8]){
   box(g,x,8.8,3.62,1.7,1.8,.2,glass);
   box(g,x,8.8,3.78,1.9,.12,.12,gold);
   arch(x,9.75,3.7,.9,0xc49a62);
   box(g,x,8.8,3.8,.1,1.7,.1,trim);
  }

  balcony(6.45,4.8);
  box(g,0,12,0,9.7,.3,7.7,trim);
  roof(g,0,14.2,0,7.5,3.2,7.5,roofMat);
  cylinder(g,0,16,0,.45,.45,1,gold,12);
 }

 // المستوى الرابع: فيلا عربية فخمة
 if(level===4){
  columns();
  balcony(6.3,4.8);

  box(g,0,8.4,0,9,4.1,7,wall);
  box(g,0,10.5,0,9.5,.3,7.5,gold);

  for(const x of [-3,0,3]){
   box(g,x,8.6,3.62,1.5,2,.2,glass);
   box(g,x,8.6,3.78,.12,2.1,.12,trim);
   box(g,x,8.6,3.78,1.6,.12,.12,trim);
   arch(x,9.65,3.7,.75,0xc49a62);
  }

  box(g,0,11.1,0,11,.5,9,roofMat);
  box(g,0,11.6,0,8,.3,6.5,trim);

  // قبة صغيرة فوق الفيلا
  const dome=new THREE.Mesh(
   new THREE.SphereGeometry(2.1,24,16,0,Math.PI*2,0,Math.PI/2),
   roofMat
  );
  dome.position.set(0,11.8,0);
  g.add(dome);
  cylinder(g,0,13.85,0,.12,.12,.7,gold,12);
 }

 // المستوى الخامس: قصر عربي ملكي
 if(level===5){
  columns();

  // جناح علوي كبير
  box(g,0,8.5,0,9,4.5,7,wall);
  box(g,0,10.8,0,10,.3,8,trim);

  // شرفات القصر
  balcony(6.5,4.9);
  for(const x of [-3,0,3]){
   box(g,x,8.8,3.62,1.55,2.2,.2,glass);
   box(g,x,8.8,3.8,.12,2.3,.12,gold);
   box(g,x,8.8,3.8,1.65,.12,.12,gold);
   arch(x,9.95,3.7,.8,0xd1ad66);
  }

  // سطح القصر
  box(g,0,11.5,0,11,.7,9,roofMat);
  box(g,0,12,0,9,.25,7,trim);

  // قبة مركزية
  const dome=new THREE.Mesh(
   new THREE.SphereGeometry(2.6,28,18,0,Math.PI*2,0,Math.PI/2),
   mat(0x368a83)
  );
  dome.position.set(0,12.1,0);
  g.add(dome);
  cylinder(g,0,14.7,0,.15,.15,1,gold,12);

  // قباب جانبية صغيرة
  for(const x of [-4,4]){
   const small=new THREE.Mesh(
    new THREE.SphereGeometry(1.1,20,12,0,Math.PI*2,0,Math.PI/2),
    mat(0x368a83)
   );
   small.position.set(x,11.9,0);
   g.add(small);
   cylinder(g,x,12.9,0,.1,.1,.5,gold,10);
  }

  // أبراج القصر
  for(const x of [-4.5,4.5]){
   cylinder(g,x,7,0,.75,.9,13,wall,12);
   cylinder(g,x,13.5,0,1,.8,.3,gold,12);
   roof(g,x,15,0,1.2,2,1.2,roofMat);
  }
 }

 // حواف وزخارف ذهبية جانبية
 for(const z of [-3.8,3.8]){
  box(g,0,.7,z,10,.15,.15,gold);
 }
 for(const x of [-4.9,4.9]){
  box(g,x,3,0,.15,5.8,7.8,trim);
 }

 const label=makeLabel(data.name);
 label.position.y=19;g.add(label);
 g.userData.houseId=data.id;
 g.traverse(o=>{if(o.isMesh)o.userData.houseId=data.id});
 return g;
}

function getLotPosition(index){
 const cols=32;let found=0;
 for(let r=0;r<80;r++){
  for(let c=0;c<cols;c++){
   const x=(Math.floor(c/4)*86+(c%4)*18)-340;
   const z=(Math.floor(r/4)*86+(r%4)*18)-340;
   if(Math.abs(x)<95&&Math.abs(z)<95)continue;
   if(found===index)return {x,z};
   found++;
  }
 }
 return {x:0,z:0};
}

function addHouseToScene(data){
 if(houses.some(h=>String(h.id)===String(data.id)))return;

 const fallback=getLotPosition(houses.length);
 const pos={
  x:data.x!==null&&data.x!==undefined&&data.x!==""?Number(data.x):fallback.x,
  z:data.z!==null&&data.z!==undefined&&data.z!==""?Number(data.z):fallback.z
 };

 const normalized={
  ...data,
  level:Math.min(5,Math.max(1,Number(data.level)||1)),
  x:Number.isFinite(pos.x)?pos.x:fallback.x,
  z:Number.isFinite(pos.z)?pos.z:fallback.z,
  account:data.account||""
 };

 const obj=makeHouse(normalized,houses.length);
 obj.position.set(normalized.x,0,normalized.z);
 houseRoot.add(obj);
 houses.push({...normalized,object:obj});
 updateCounter();
}

function updateHouseInScene(data){
 const i=houses.findIndex(h=>String(h.id)===String(data.id));
 if(i<0)return;
 const old=houses[i];
 houseRoot.remove(old.object);
 const updated={...old,...data};
 const obj=makeHouse(updated,i);
 obj.position.set(old.x,0,old.z);
 houseRoot.add(obj);
 houses[i]={...updated,object:obj};
 updateCounter();
 showInfo(data.id);
}

function updateCounter(){
 document.getElementById("counter").textContent="🏘️ المتابعون: "+houses.length;
}

async function loadHouses(){
 document.getElementById("counter").textContent="⏳ جارٍ تحميل البيوت...";

 const {data,error}=await supabase
  .from("houses")
  .select("*")
  .order("created_at",{ascending:true});

 if(error){
  console.error("خطأ تحميل البيوت:",error);
  document.getElementById("counter").textContent="تعذر تحميل البيوت";
  alert("تعذر تحميل البيوت: "+error.message);
  return;
 }

 houses.forEach(h=>houseRoot.remove(h.object));
 houses=[];

 (data||[]).forEach((row,index)=>{
  const fallback=getLotPosition(index);
  addHouseToScene({
   id:row.id,
   name:row.name||"متابع",
   account:row.account||"",
   level:row.level||1,
   x:row.x!==null&&row.x!==undefined?Number(row.x):fallback.x,
   z:row.z!==null&&row.z!==undefined?Number(row.z):
     row.y!==null&&row.y!==undefined?Number(row.y):fallback.z,
   y:row.y,
   district:row.district||"المدينة",
   house_number:row.house_number
  });
 });

 updateCounter();
 console.log("تم تحميل البيوت:",houses.length);
}
await loadHouses();

window.openAdd=()=>{
 if(!isAdmin){alert("هذه الخاصية للمدير فقط");return}
 editingId=null;chosenLevel=1;
 document.getElementById("modalTitle").textContent="🏡 إضافة بيت جديد";
 document.getElementById("followerName").value="";
 document.getElementById("followerAccount").value="";
 chooseLevel(1);
 document.getElementById("modal").style.display="flex";
};
window.closeModal=()=>document.getElementById("modal").style.display="none";

window.chooseLevel=(level)=>{
 chosenLevel=level;
 document.querySelectorAll(".level").forEach(el=>{
  el.classList.toggle("selected",Number(el.dataset.level)===level);
 });
};

window.saveHouse=async()=>{
 if(!isAdmin){alert("هذه الخاصية للمدير فقط");return}
 const name=document.getElementById("followerName").value.trim();
 const account=document.getElementById("followerAccount").value.trim();
 if(!name){alert("اكتب اسم المتابع أولاً");return}

 const btn=document.getElementById("saveHouseBtn");
 btn.disabled=true;btn.textContent="جارٍ الحفظ...";

 try{
  if(editingId){
   const old=houses.find(h=>String(h.id)===String(editingId));
   if(!old)throw new Error("لم يتم العثور على البيت");

   const changes={name,account,level:chosenLevel};
   const {data,error}=await supabase
    .from("houses")
    .update(changes)
    .eq("id",editingId)
    .select("*")
    .single();

   if(error)throw error;
   updateHouseInScene({...old,...data});
   editingId=null;

  }else{
   const pos=getLotPosition(houses.length);
   const record={
    name:name,
    account:account,
    level:chosenLevel,
    x:pos.x,
    y:0,
    z:pos.z,
    house_number:houses.length+1,
    district:"المدينة"
   };

   const {data,error}=await supabase
    .from("houses")
    .insert(record)
    .select("*")
    .single();

   if(error)throw error;

   addHouseToScene({
    id:data.id,
    name:data.name||name,
    account:data.account||account,
    level:data.level||chosenLevel,
    x:data.x!==null&&data.x!==undefined?Number(data.x):pos.x,
    z:data.z!==null&&data.z!==undefined?Number(data.z):pos.z,
    y:data.y,
    house_number:data.house_number,
    district:data.district
   });
  }

  closeModal();
 }catch(error){
  console.error("خطأ حفظ البيت:",error);
  alert("لم يتم حفظ البيت: "+(error.message||"خطأ غير معروف"));
 }finally{
  btn.disabled=false;
  btn.textContent="حفظ البيت";
 }
};

window.editSelected=()=>{
 if(!isAdmin){alert("هذه الخاصية للمدير فقط");return}
 const h=houses.find(x=>String(x.id)===String(selectedId));
 if(!h)return;
 editingId=h.id;chosenLevel=h.level;
 document.getElementById("modalTitle").textContent="✏️ تعديل بيانات البيت";
 document.getElementById("followerName").value=h.name;
 document.getElementById("followerAccount").value=h.account||"";
 chooseLevel(h.level);
 document.getElementById("modal").style.display="flex";
};

window.deleteSelected=async()=>{
 if(!isAdmin){alert("هذه الخاصية للمدير فقط");return}
 const h=houses.find(x=>String(x.id)===String(selectedId));
 if(!h)return;
 if(!confirm("متأكد تريد تحذف بيت "+h.name+"؟"))return;

 const {error}=await supabase.from("houses").delete().eq("id",h.id);
 if(error){alert("تعذر حذف البيت: "+error.message);return}

 houseRoot.remove(h.object);
 houses=houses.filter(x=>String(x.id)!==String(h.id));
 selectedId=null;
 document.getElementById("info").style.display="none";
 updateCounter();
};

window.closeInfo=()=>{
 selectedId=null;
 document.getElementById("info").style.display="none";
};

function showInfo(id){
 const h=houses.find(x=>String(x.id)===String(id));
 if(!h)return;
 selectedId=id;
 document.getElementById("infoName").textContent="🏡 "+h.name;
 document.getElementById("infoLevel").textContent=
  "المستوى "+h.level+" — "+levelNames[h.level-1]+
  (h.account?" • "+h.account:"");
 document.getElementById("info").style.display="block";
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let downX=0,downY=0;

renderer.domElement.addEventListener("pointerdown",e=>{
 downX=e.clientX;downY=e.clientY;
});

renderer.domElement.addEventListener("pointerup",e=>{
 if(Math.abs(e.clientX-downX)>6||Math.abs(e.clientY-downY)>6)return;
 pointer.x=(e.clientX/innerWidth)*2-1;
 pointer.y=-(e.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(houseRoot.children,true);
 if(!hits.length)return;
 let id=hits[0].object.userData.houseId;
 if(!id){
  let p=hits[0].object.parent;
  while(p&&!id){id=p.userData.houseId;p=p.parent}
 }
 if(id)showInfo(id);
});

window.searchHouse=()=>{
 const q=document.getElementById("search").value.trim().toLowerCase();
 if(!q)return;
 const h=houses.find(x=>
  (x.name||"").toLowerCase().includes(q)||
  (x.account||"").toLowerCase().includes(q)
 );
 if(!h){alert("لم يتم العثور على المتابع");return}
 controls.target.set(h.x,0,h.z);
 camera.position.set(h.x+45,55,h.z+55);
 showInfo(h.id);
};

window.zoomIn=()=>{camera.position.multiplyScalar(.85);controls.update()};
window.zoomOut=()=>{camera.position.multiplyScalar(1.18);controls.update()};
window.resetView=()=>{
 camera.position.set(170,190,210);
 controls.target.set(0,0,0);
 controls.update();
 closeInfo();
};

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();
</script>
