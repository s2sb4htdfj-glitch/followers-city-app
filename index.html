
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مدينة المتابعين</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#9bd3e2}
#city{position:fixed;inset:0;touch-action:none}
header{position:fixed;z-index:5;top:10px;left:10px;right:10px;background:#142536ed;color:white;border-radius:15px;padding:12px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:18px;margin:0 0 5px}
#count{font-size:13px;color:#bce9dc}
#searchbar{position:fixed;z-index:5;top:83px;left:10px;right:10px;display:flex;gap:6px}
input{min-width:0;width:100%;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:15px;background:white;color:#222}
button{border:0;border-radius:10px;padding:11px 13px;background:#13a879;color:white;font-weight:bold}
#add{position:fixed;z-index:5;bottom:18px;right:12px;padding:14px 17px}
#zoom{position:fixed;z-index:5;bottom:18px;left:12px;display:flex;flex-direction:column;gap:7px}
#zoom button{background:#142536;width:45px;height:45px;font-size:22px}
#info{display:none;position:fixed;z-index:6;bottom:18px;right:12px;left:100px;background:#142536ed;color:white;padding:13px;border-radius:12px;font-size:14px;line-height:1.8}
#info a{color:#8ce5c2}
#hint{position:fixed;z-index:4;bottom:78px;left:8px;right:8px;text-align:center;color:#183a36;font-size:12px;pointer-events:none}
#modal{display:none;position:fixed;z-index:20;inset:0;background:#0009;align-items:center;justify-content:center;padding:15px}
#panel{background:#fff;color:#172536;border-radius:18px;padding:20px;width:100%;max-width:390px;max-height:90vh;overflow:auto}
#panel h3{margin:0 0 15px;font-size:20px}
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.level{border:2px solid #ddd;border-radius:12px;padding:10px;text-align:center;background:#f7f9fa;color:#172536;cursor:pointer}
.level.selected{border-color:#12a878;background:#e7f8f0}
.level .emoji{font-size:30px;display:block;margin-bottom:5px}
.level small{display:block;color:#667;font-size:11px;margin-top:4px}
.actions{display:flex;gap:8px;margin-top:18px}
.actions button{flex:1}
#cancel{background:#697784}
</style>
</head>
<body>

<div id="city"></div>

<header>
 <div>
  <h2>🏙️ مدينة المتابعين</h2>
  <div style="font-size:12px;color:#c4d8e3">كل متابع إله بيت خاص بيه ❤️</div>
 </div>
 <div style="text-align:center">
  <div style="font-size:22px">🏠</div>
  <div id="count">0 بيوت</div>
 </div>
</header>

<div id="searchbar">
 <input id="search" placeholder="🔍 ابحث عن اسم المتابع">
 <button onclick="findHouse()">بحث</button>
</div>

<div id="zoom">
 <button onclick="zoomIn()">＋</button>
 <button onclick="zoomOut()">－</button>
 <button onclick="resetView()" style="font-size:16px">↺</button>
</div>

<button id="add" onclick="openModal()">＋ إضافة بيت</button>
<div id="info"></div>
<div id="hint">اسحب بإصبع واحد لتحريك المدينة • اضغط على البيت لمعلوماته</div>

<div id="modal">
 <div id="panel">
  <h3>🏡 إضافة بيت جديد</h3>
  <div class="field">
   <label for="personName">اسم المتابع</label>
   <input id="personName" placeholder="اكتب اسم المتابع">
  </div>
  <div class="field">
   <label for="personAccount">حساب المتابع أو رابطه</label>
   <input id="personAccount" placeholder="@username أو رابط الحساب">
  </div>
  <div class="field">
   <label>اختر مستوى البيت</label>
   <div class="levels" id="levels">
    <div class="level selected" data-level="1"><span class="emoji">🏠</span>المستوى 1<small>بيت صغير</small></div>
    <div class="level" data-level="2"><span class="emoji">🏡</span>المستوى 2<small>بيت عادي</small></div>
    <div class="level" data-level="3"><span class="emoji">🏘️</span>المستوى 3<small>بيت كبير</small></div>
    <div class="level" data-level="4"><span class="emoji">🏛️</span>المستوى 4<small>فيلا فاخرة</small></div>
    <div class="level" data-level="5" style="grid-column:span 2"><span class="emoji">👑</span>المستوى 5<small>قصر ضخم</small></div>
   </div>
  </div>
  <div class="actions">
   <button onclick="saveHouse()">إضافة البيت</button>
   <button id="cancel" onclick="closeModal()">إلغاء</button>
  </div>
 </div>
</div>

<script type="importmap">
{"imports":{
"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xc9dfdf);
scene.fog=new THREE.Fog(0xc9dfdf,220,520);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);
camera.position.set(170,190,210);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.getElementById("city").appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true;
controls.enableRotate=false;
controls.enablePan=true;
controls.screenSpacePanning=true;
controls.minDistance=35;
controls.maxDistance=400;
controls.maxPolarAngle=Math.PI/2.15;
controls.touches.ONE=THREE.TOUCH.PAN;
controls.touches.TWO=THREE.TOUCH.DOLLY_PAN;

scene.add(new THREE.HemisphereLight(0xffffff,0x82765c,2));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(100,180,80);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
scene.add(sun);

const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85});
function block(w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y,z);
 m.castShadow=true;
 m.receiveShadow=true;
 scene.add(m);
 return m;
}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(380,380),mat(0xd8c69f));
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// الطرق الرئيسية والفرعية
function road(x,z,w,d){
 block(w,.25,d,0x55585a,x,.12,z);
}
for(let p=-160;p<=160;p+=40){
 road(p,0,9,320);
 road(0,p,320,9);
}

// أرصفة الأحياء ومساحاتها
for(let x=-150;x<=150;x+=20){
 for(let z=-150;z<=150;z+=20){
  if(Math.abs(x)<38&&Math.abs(z)<38)continue;
  block(1,.08,1,0xc7b58f,x,.1,z);
 }
}

// أشجار النخيل
function tree(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.5,.8,4,8),mat(0x765238));
 trunk.position.set(x,2,z);
 scene.add(trunk);
 const crown=new THREE.Group();
 for(let i=0;i<7;i++){
  const leaf=new THREE.Mesh(new THREE.ConeGeometry(.65,5,6),mat(0x47804a));
  leaf.rotation.z=Math.PI/2;
  leaf.rotation.y=i*Math.PI*2/7;
  leaf.position.set(Math.cos(i*Math.PI*2/7)*1.7,0,Math.sin(i*Math.PI*2/7)*1.7);
  crown.add(leaf);
 }
 crown.position.set(x,4.5,z);
 scene.add(crown);
}
for(let i=-150;i<=150;i+=20){
 tree(i,-7);
 tree(i,7);
}

// لافتات المعالم
function label(text,x,y,z){
 const c=document.createElement("canvas");
 c.width=512;c.height=128;
 const ctx=c.getContext("2d");
 ctx.fillStyle="#fff";
 ctx.beginPath();ctx.roundRect(5,5,502,118,20);ctx.fill();
 ctx.fillStyle="#263b30";
 ctx.font="bold 48px Arial";
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(text,256,65);
 const texture=new THREE.CanvasTexture(c);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true}));
 sprite.position.set(x,y,z);
 sprite.scale.set(25,6,1);
 scene.add(sprite);
}

// الساحة المركزية
block(48,.4,48,0xc5ad87,0,.3,0);
const fountain=new THREE.Mesh(new THREE.CylinderGeometry(9,10,1.5,32),mat(0x9bafa9));
fountain.position.set(0,1,0);scene.add(fountain);
const water=new THREE.Mesh(new THREE.CylinderGeometry(7,7,.3,32),mat(0x48a9c0));
water.position.set(0,1.9,0);scene.add(water);
const fountainTop=new THREE.Mesh(new THREE.CylinderGeometry(1,1.4,5,12),mat(0x9bafa9));
fountainTop.position.set(0,4,0);scene.add(fountainTop);

// جامع التوابين
function buildMosque(){
 const x=0,z=-70;
 block(35,13,28,0xf0dfbd,x,6.5,z);
 block(39,1.5,32,0xb58c5d,x,13.5,z);
 const dome=new THREE.Mesh(new THREE.SphereGeometry(10,32,20,0,Math.PI*2,0,Math.PI/2),mat(0x397e62));
 dome.position.set(x,15,z);scene.add(dome);
 for(const dx of [-18,18]){
  block(3,25,3,0xe9d7b4,x+dx,12.5,z-8);
  const cap=new THREE.Mesh(new THREE.ConeGeometry(2.5,5,12),mat(0x397e62));
  cap.position.set(x+dx,27,z-8);scene.add(cap);
  block(4.5,1.2,4.5,0xc4a16f,x+dx,20,z-8);
 }
 block(9,8,1.5,0x98704b,x,4,z+14);
 label("جامع التوابين",x,34,z);
}
buildMosque();

// بيت العمدة
function buildMayor(){
 const x=-75,z=-70;
 block(27,12,22,0xe5c99c,x,6,z);
 block(13,9,9,0xf2dfbd,x,16,z);
 for(const dx of [-10,0,10]){
  block(1,8,1,0x98714c,x+dx,4,z+12);
 }
 const dome=new THREE.Mesh(new THREE.SphereGeometry(5,24,16,0,Math.PI*2,0,Math.PI/2),mat(0x4b806d));
 dome.position.set(x,20,z);scene.add(dome);
 block(34,.3,4,0xc9ae84,x,0.2,z+16);
 label("بيت العمدة",x,28,z);
}
buildMayor();

// المدرسة: طابقان ونوافذ وساحة
function buildSchool(){
 const x=75,z=-70;
 block(32,12,19,0xe8d4ad,x,6,z);
 block(34,1,21,0x96734d,x,12.5,z);
 for(const dx of [-12,-6,6,12]){
  block(2.5,3,.3,0x75a9b8,x+dx,8,z+9.7);
  block(2.5,3,.3,0x75a9b8,x+dx,8,z-9.7);
 }
 block(7,7,1,0x896747,x,3.5,z+10);
 block(28,.3,18,0xcab18b,x,.2,z+25);
 block(17,.3,10,0x4a8750,x,.4,z+25);
 block(.4,9,.4,0x777777,x,4.5,z+35);
 label("المدرسة",x,20,z);
}
buildSchool();

// المتحف: أعمدة وقبة ودرج
function buildMuseum(){
 const x=-75,z=75;
 block(29,13,21,0xe7d8bb,x,6.5,z);
 block(33,1.5,25,0xb18c61,x,14,z);
 for(const dx of [-11,-4,4,11]){
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.8,.9,11,12),mat(0xf8ead1));
  c.position.set(x+dx,7,z+11);scene.add(c);
 }
 block(21,1,5,0xc1a17a,x,1,z+15);
 block(17,1,4,0xd5bd98,x,2,z+19);
 const dome=new THREE.Mesh(new THREE.SphereGeometry(7,24,16,0,Math.PI*2,0,Math.PI/2),mat(0x9a8063));
 dome.position.set(x,14,z);scene.add(dome);
 label("المتحف",x,25,z);
}
buildMuseum();

// السوق الشعبي: محلات ومظلات
function buildMarket(){
 const x=75,z=75;
 const colors=[0xd9a46e,0xb96e4d,0xe3c38c,0x9eaa83,0xd1a2a2];
 for(let i=0;i<5;i++){
  const sx=x-18+i*9;
  block(8,7,9,colors[i],sx,3.5,z);
  block(8,.7,10,0x76533b,sx,7.2,z);
  block(3,3,.3,0x83a9aa,sx,2.5,z+4.7);
  block(8,.5,4,i%2?0xd4b05f:0xb34e42,sx,7.5,z+7);
 }
 block(50,.2,15,0xcbb18d,x,.2,z+16);
 for(let i=0;i<4;i++)block(4,1,3,0x9c704b,x-15+i*10,1,z+18);
 label("السوق الشعبي",x,14,z);
}
buildMarket();

// ملعب كرة القدم
function buildStadium(){
 const x=0,z=80;
 block(54,3,40,0x81766a,x,1.5,z);
 block(42,.3,28,0x39834b,x,3.2,z);
 for(const dx of [-20,0,20]){
  block(.2,.08,28,0xffffff,x+dx,3.4,z);
 }
 block(42,.08,.2,0xffffff,x,3.4,z);
 const circle=new THREE.Mesh(new THREE.TorusGeometry(5,.12,8,32),mat(0xffffff));
 circle.rotation.x=Math.PI/2;circle.position.set(x,3.5,z);scene.add(circle);
 for(const dz of [-19,19]){
  for(let i=0;i<3;i++)block(48,1.5,2,0xb7a17e,x,4+i*1.5,z+dz);
 }
 for(const dx of [-26,26]){
  for(const dz of [-18,18]){
   block(.6,15,.6,0x77736c,x+dx,8,z+dz);
  }
 }
 label("ملعب المدينة",x,22,z);
}
buildStadium();

// حديقة مركزية إضافية
function buildPark(){
 block(42,.2,35,0x69a75b,0,.15,140);
 for(let i=-15;i<=15;i+=10){
  tree(i,127);tree(i,153);
 }
 label("حديقة المدينة",0,9,140);
}
buildPark();

// نظام بيوت المتابعين
const followers=[];
const clickable=[];
const houseObjects=[];
const houseColors=[0xf4c46a,0xe58e78,0x79b9df,0xb99be5,0xe4a8c2,0x91c98b,0xe4d18b];
const levelNames=["","بيت صغير","بيت عادي","بيت كبير","فيلا فاخرة","قصر ضخم"];
const levelSizes=[0,.75,1,1.25,1.55,1.9];

function makeLabel(text){
 const canvas=document.createElement("canvas");
 canvas.width=512;canvas.height=128;
 const ctx=canvas.getContext("2d");
 ctx.fillStyle="#142536";
 ctx.beginPath();ctx.roundRect(5,5,502,118,25);ctx.fill();
 ctx.fillStyle="white";
 ctx.font="bold 42px Arial";
 ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillText(text,256,65);
 const texture=new THREE.CanvasTexture(canvas);
 const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:texture,transparent:true}));
 sprite.scale.set(7,1.7,1);
 return sprite;
}

function addHouse(person){
 const group=new THREE.Group();
 group.position.set(person.x,0,person.z);
 const size=levelSizes[person.level];

 const base=new THREE.Mesh(
  new THREE.BoxGeometry(4*size,2.6*size,3.5*size),
  new THREE.MeshStandardMaterial({color:person.color||houseColors[(person.number-1)%houseColors.length]})
 );
 base.position.y=1.3*size;
 base.castShadow=true;
 base.receiveShadow=true;
 group.add(base);

 const roof=new THREE.Mesh(
  new THREE.ConeGeometry(3.1*size,2.1*size,4),
  mat(person.level===5?0xd5aa38:0x994d3d)
 );
 roof.position.y=3.6*size;
 roof.rotation.y=Math.PI/4;
 roof.castShadow=true;
 group.add(roof);

 const door=new THREE.Mesh(new THREE.BoxGeometry(.8*size,1.5*size,.12*size),mat(0x70452e));
 door.position.set(0,.75*size,1.81*size);
 group.add(door);

 for(const x of [-1.15,1.15]){
  const win=new THREE.Mesh(new THREE.BoxGeometry(.75*size,.75*size,.12*size),mat(0x9de5ed));
  win.position.set(x*size,1.8*size,1.82*size);
  group.add(win);
 }

 if(person.level>=3){
  blockHouseBalcony(group,size);
 }
 if(person.level===5){
  const tower=new THREE.Mesh(new THREE.ConeGeometry(.55,1.5,4),mat(0xe8bd43));
  tower.position.set(0,5.3*size,0);
  group.add(tower);
 }

 const nameLabel=makeLabel(person.name+" #"+person.number);
 nameLabel.position.set(0,5.7*size,0);
 group.add(nameLabel);
 scene.add(group);
 clickable.push(base);
 base.userData.person=person;
 houseObjects.push({person,group});
}
function blockHouseBalcony(group,size){
 const balcony=new THREE.Mesh(new THREE.BoxGeometry(2.8*size,.18*size,.7*size),mat(0xe5e1d5));
 balcony.position.set(0,1.15*size,2.05*size);
 group.add(balcony);
}

// توزيع البيوت في أحياء واسعة
function getPosition(index){
 const columns=12;
 const col=index%columns;
 const row=Math.floor(index/columns);
 return [-145+col*25,115+row*23];
}

function updateCount(){
 document.getElementById("count").textContent=followers.length+" بيوت";
}

let selectedLevel=1;
window.openModal=()=>document.getElementById("modal").style.display="flex";
window.closeModal=()=>document.getElementById("modal").style.display="none";

document.querySelectorAll(".level").forEach(el=>{
 el.addEventListener("click",()=>{
  document.querySelectorAll(".level").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
  selectedLevel=Number(el.dataset.level);
 });
});

window.saveHouse=function(){
 const name=document.getElementById("personName").value.trim();
 const account=document.getElementById("personAccount").value.trim();
 if(!name){alert("اكتب اسم المتابع أولاً");return}
 if(followers.length>=1000){alert("وصلنا إلى 1000 بيت");return}
 const number=followers.length+1;
 const pos=getPosition(followers.length);
 const person={name,account,number,x:pos[0],z:pos[1],level:selectedLevel,color:houseColors[(number-1)%houseColors.length]};
 followers.push(person);
 addHouse(person);
 updateCount();
 closeModal();
 document.getElementById("personName").value="";
 document.getElementById("personAccount").value="";
 showInfo(person);
 alert("تمت إضافة بيت "+name);
};

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function showInfo(person){
 const box=document.getElementById("info");
 box.style.display="block";
 let accountHtml=escapeHTML(person.account||"غير مضاف");
 if(person.account){
  let url=person.account;
  if(url.startsWith("@"))url="https://www.instagram.com/"+url.slice(1);
  else if(!/^https?:\/\//i.test(url))url="https://"+url;
  try{
   const parsed=new URL(url);
   if(parsed.protocol==="http:"||parsed.protocol==="https:"){
    accountHtml='<a href="'+escapeHTML(parsed.href)+'" target="_blank" rel="noopener">فتح حساب المتابع</a>';
   }
  }catch(e){}
 }
 box.innerHTML="<b>🏠 معلومات البيت</b><br>"+
 "الاسم: "+escapeHTML(person.name)+"<br>"+
 "رقم البيت: "+person.number+"<br>"+
 "الحساب: "+accountHtml+"<br>"+
 "المستوى: "+person.level+" - "+levelNames[person.level];
}

const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
let downX=0,downY=0;
renderer.domElement.addEventListener("pointerdown",e=>{downX=e.clientX;downY=e.clientY});
renderer.domElement.addEventListener("pointerup",e=>{
 if(Math.hypot(e.clientX-downX,e.clientY-downY)>8)return;
 pointer.x=(e.clientX/innerWidth)*2-1;
 pointer.y=-(e.clientY/innerHeight)*2+1;
 raycaster.setFromCamera(pointer,camera);
 const hits=raycaster.intersectObjects(clickable);
 if(hits.length)showInfo(hits[0].object.userData.person);
});

window.findHouse=function(){
 const value=document.getElementById("search").value.trim().toLowerCase();
 if(!value){alert("اكتب اسم المتابع");return}
 const found=followers.find(p=>p.name.toLowerCase().includes(value)||(p.account&&p.account.toLowerCase().includes(value)));
 if(!found){alert("لم يتم العثور على المتابع");return}
 controls.target.set(found.x,0,found.z);
 camera.position.set(found.x+25,35,found.z+30);
 showInfo(found);
};

window.zoomIn=()=>camera.position.multiplyScalar(.85);
window.zoomOut=()=>camera.position.multiplyScalar(1.15);
window.resetView=()=>{
 camera.position.set(170,190,210);
 controls.target.set(0,0,0);
 document.getElementById("info").style.display="none";
};

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
